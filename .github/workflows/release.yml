# Adapted from snesrecomp/tools/new_project/templates/release.yml.in, with
# GundamWingEndlessDuelSNESRecomp as the reference consumer. Manual only: the
# studio bulk tool owns release scheduling. This workflow checks compilation
# and ROM-free regressions; it does not generate a game or publish a release.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev libgl1-mesa-dev python3

      - name: Record framework pins
        run: |
          git ls-tree HEAD snesrecomp recomp-ui third_party/starfox-enhanced
          git submodule status --recursive

      - name: Configure ROM-free host check
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTARFOX_HOST_CHECK_ONLY=ON \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_ENABLE_TRACE=OFF

      - name: Compile host, shared runtime, launcher, and native renderer
        run: cmake --build build-ci --parallel 2

      - name: Star Fox ROM-free regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Framework tests
        run: bash snesrecomp/tests/run_c_tests.sh
