[General]
Autosave = 0
# Host presentation cadence. 20/30 skip rendering; 90+ duplicate the newest
# completed presentation with vsync disabled. Simulation still runs at the
# normal SNES frame cadence, and high-FPS transform interpolation is not yet
# implemented.
PresentationFPS = 60
ShowFPS = 0
DisableFrameDelay = 0
# Set by the launcher's "Skip launcher" option. Pass --launcher to force the
# dashboard back on for a single run.
SkipLauncher = 0
# Oracle-build only. Keep disabled until Star Fox can share synchronized
# input recordings and Super FX-aware save states with the oracle process.
# Independently advanced sessions produce false divergences.
EnableSnes9xOracle = false

[Graphics]
WindowSize = Auto
Fullscreen = 0
WindowScale = 3
NewRenderer = 1
IgnoreAspectRatio = 0
NoSpriteLimits = 1
# Expanded viewport. Use Off (authentic 4:3), 16:10, 16:9, 21:9, 32:9,
# or an integer from 0-272 for custom extra pixels per side.
# Enhanced-style DisplayMode aliases are also accepted:
# 0/4:3, 1/16:9, 2/16:10, 3/21:9, and 4/32:9.
Widescreen = Off
# Original preserves the retail palette. Other options: White, Green, Blue,
# Red, Yellow, Cyan, Magenta, Orange.
CrosshairColor = Original
# Native renderer path. Star Fox widescreen output is only produced here;
# the stock renderer remains authentic 4:3.
EnhancedRenderer = 0

[Features]
# Enhanced-derived gameplay mods. GodNuke only has an effect while GodMode is
# enabled; hold R while firing a Nova Bomb with A to trigger the screen clear.
GodMode = 0
GodNuke = 1

[Sound]
EnableAudio = 1
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 512

[KeyMap]
# Every hotkey the game responds to is listed here and rebindable.
# Prefix with Shift+/Ctrl+/Alt+ as needed; SDL key names (F1, Tab, p, ...).
# Leave a value empty to unbind the hotkey entirely (e.g. "DisplayPerf =").
Fullscreen = Alt+Return
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down
VolumeUp = Shift+=
VolumeDown = Shift+-
# Toggle the FPS/perf readout (in-window or title bar).
DisplayPerf = f
# Switch between the old and new PPU renderer at runtime.
ToggleRenderer = r
# Presentation debugger: freeze, step forward, step back.
PresentationDebug = Ctrl+F5
PresentationStepForward = Ctrl+F6
PresentationStepBack = Ctrl+F7
Load =      F1,     F2,     F3,     F4,     F5,     F6,     F7,     F8,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10

[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = true
# Analog stick deadzone (raw axis units, range 1-32767).
# 10000 ~ 30% deflection. Increase if idle stick drifts trigger movement.
GamepadDeadzone = 10000
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
